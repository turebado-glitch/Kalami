name: Build Kalami Android Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP if needed
        run: |
          if [ ! -f package.json ]; then
            ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              unzip -oq "$ZIP_FILE"
              if [ ! -f package.json ]; then
                SUBDIR=$(find . -maxdepth 2 -name package.json -exec dirname {} \; | head -n 1)
                if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
                  cp -a "$SUBDIR"/. .
                fi
              fi
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Prepare Release Signing Keystore (No Secrets Required)
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/android/release-keystore.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "kalami-release-key" \
            -alias "kalami" \
            -keypass "kalami-release-key" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Kalami, O=Kalami, C=ID"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=kalami-release-key" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=kalami" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=kalami-release-key" >> $GITHUB_ENV

      - name: Build Android Release APK & AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalami-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Kalami-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
